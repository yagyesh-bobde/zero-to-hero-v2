<html lang="en" data-ota-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141416" />
    <meta
      name="description"
      content="Understand React Native over-the-air updates from first principles. Explore Zepto Delta, binary patches, native bundle loading, staged rollouts, and recovery through 24 lessons and interactive labs."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      try {
        document.documentElement.dataset.otaTheme =
          localStorage.getItem('rn-ota-theme-v1') === 'light' ? 'light' : 'dark';
      } catch {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/ota/main.tsx"></script>
