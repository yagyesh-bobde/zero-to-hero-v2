<!doctype html>
<html lang="en" data-network-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141416" />
    <meta
      name="description"
      content="Build reliable React Native networking from first principles: 28 lessons, interactive labs, executable JavaScript exercises, authentication, offline recovery, and end-to-end observability."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>React Native Networking — Zero to Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      try {
        document.documentElement.dataset.networkTheme =
          localStorage.getItem('rn-networking-theme-v1') === 'light' ? 'light' : 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/networking/main.tsx"></script>
