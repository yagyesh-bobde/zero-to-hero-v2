<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171d1a" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('zero-to-hero-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#171d1a' : '#f8f7f3';
      })();
    </script>
    <meta
      name="description"
      content="Learn neural networks by building them. An interactive, hands-on companion to Andrej Karpathy's Zero to Hero: from backpropagation to GPT."
    />
    <title>Zero to Hero — Learn by building.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
